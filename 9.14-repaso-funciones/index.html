<!DOCTYPE html>
<html lang="es" data-theme="autumn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>validar nombre</title>

    <link href="https://cdn.jsdelivr.net/npm/daisyui@5.0.0-beta.6/daisyui.css" rel="stylesheet" type="text/css" />
    <link href="https://cdn.jsdelivr.net/npm/daisyui@5.0.0-beta.6/themes.css" rel="stylesheet" type="text/css" />
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inclusive+Sans&display=swap" rel="stylesheet">

    <style>
        body {
            background-image: url("img/noche.webp");
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            background-attachment: fixed;
        }
    </style>
</head>
<body class="relative flex min-h-screen flex-col pb-8 font-[Inclusive_Sans,sans-serif] text-base-content/75">

    <main class="relative flex flex-grow flex-col items-center p-6 pt-12 md:pt-16">

        <h1 class="mb-10 w-full max-w-6xl rounded-2xl bg-base-100 px-8 py-4 text-center text-sm font-medium text-base-content/75 shadow-md sm:text-base md:mb-12 md:text-lg">
            Escribe un nombre para validarlo. Solo se permiten letras, apóstrofes (como en D'Onoffrio) y espacios entre palabras. 
        </h1>

        <section class="flex w-full flex-grow items-center justify-center">

            <div class="card w-full max-w-lg border border-base-300 bg-base-100 shadow-lg">
                <form id="formTexto" class="card-body gap-6">

                    <div class="form-control">
                        <label class="mb-2 block text-sm font-medium text-base-content/75" for="texto">
                            Escribe un nombre
                        </label>
                        <input
                            type="text"
                            id="texto"
                            name="texto"
                            required
                            autocomplete="off"
                            placeholder="Ej: Anita de la Rosa D'Onoffrio"
                            class="input input-bordered input-primary w-full bg-base-200 text-center text-base font-medium"
                        />
                    </div>

                    <button
                        type="submit"
                        class="btn btn-lg border-[#7ec8e8] bg-[#7ec8e8] text-[#0a2a4a] hover:border-[#5eb8e0] hover:bg-[#5eb8e0] hover:text-[#0a2a4a]"
                    >
                        Validar
                    </button>

                    <div id="resultado" class="flex min-h-[100px] flex-col items-center justify-center gap-2 text-center"></div>
                </form>
            </div>

        </section>

    </main>

    <script src="js/app.js"></script>
</body>
</html>
