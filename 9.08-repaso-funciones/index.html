<!DOCTYPE html>
<html lang="es" data-theme="aqua">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Eliminar patrón</title>

    <link href="https://cdn.jsdelivr.net/npm/daisyui@5.0.0-beta.6/daisyui.css" rel="stylesheet" type="text/css" />
    <link href="https://cdn.jsdelivr.net/npm/daisyui@5.0.0-beta.6/themes.css" rel="stylesheet" type="text/css" />
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inclusive+Sans&display=swap" rel="stylesheet">

    <style>
        body {
            font-family: 'Inclusive Sans', sans-serif;
            background-image:
                linear-gradient(rgba(15, 23, 42, 0.55), rgba(15, 23, 42, 0.55)),
                url('img/cccircular (2).svg');
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            background-attachment: fixed;
        }
    </style>
</head>
<body class="flex min-h-screen flex-col pb-8 text-base-content">

    <header class="w-full py-8 text-center shadow-2xl backdrop-blur-sm">
        <h1 class="text-4xl font-black uppercase tracking-tighter text-primary">Eliminar un patrón</h1>
    </header>

    <main class="flex flex-grow items-center justify-center p-4">

        <div class="card w-full max-w-md border-2 border-primary bg-base-100/95 shadow-2xl backdrop-blur-md">
            <div class="card-body gap-4">

                <div class="form-control">
                    <label class="label" for="texto">
                        <span class="label-text font-semibold">Texto</span>
                    </label>
                    <textarea id="texto" rows="2" placeholder="xyz1, xyz2, xyz3, xyz4 y xyz5"
                              class="textarea textarea-bordered textarea-secondary textarea-sm bg-base-200 w-full min-h-[2.75rem] resize-none"></textarea>
                </div>

                <div class="form-control">
                    <label class="label" for="patron">
                        <span class="label-text font-semibold">Patrón a eliminar</span>
                    </label>
                    <textarea id="patron" rows="2" placeholder="xyz"
                              class="textarea textarea-bordered textarea-secondary textarea-sm bg-base-200 w-full min-h-[2.75rem] resize-none"></textarea>
                </div>

                <button type="button" id="btnLimpiar" class="btn btn-primary btn-lg shadow-lg">
                    Limpiar texto
                </button>

                <div id="aviso" class="alert alert-warning hidden text-sm"></div>

                <div id="resultado" class="flex min-h-[80px] items-center justify-center rounded-lg bg-base-200/50 p-3">
                    <p class="text-center text-sm italic opacity-60">
                        Escribe el texto y el patrón, luego pulsa el botón
                    </p>
                </div>

            </div>
        </div>

    </main>

    <script src="js/app.js"></script>

</body>
</html>
