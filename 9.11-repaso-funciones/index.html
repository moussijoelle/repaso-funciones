<!DOCTYPE html>
<html lang="es" data-theme="autumn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Conversor binario y decimal</title>

    <link href="https://cdn.jsdelivr.net/npm/daisyui@5.0.0-beta.6/daisyui.css" rel="stylesheet" type="text/css" />
    <link href="https://cdn.jsdelivr.net/npm/daisyui@5.0.0-beta.6/themes.css" rel="stylesheet" type="text/css" />
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inclusive+Sans&display=swap" rel="stylesheet">
</head>
<body class="relative flex min-h-screen flex-col pb-8 font-[Inclusive_Sans,sans-serif] text-base-content/75">

    <div class="pointer-events-none fixed inset-0 -z-10 overflow-hidden" aria-hidden="true">
        <img
            src="img/bi.jpg"
            alt=""
            class="h-full w-full object-cover object-center"
        />
        <div class="absolute inset-0 bg-base-100/50"></div>
    </div>

    <main class="relative flex flex-grow flex-col items-center p-6 pt-12 md:pt-16">

        <h1 class="mb-10 w-full max-w-6xl rounded-2xl bg-white px-8 py-4 text-center text-sm font-medium text-black shadow-md sm:text-base md:mb-12 md:text-3xl">
            Introduce un número y elige la conversión entre binario y decimal
        </h1>

        <section class="flex w-full flex-grow items-center justify-center">

            <div class="card w-full max-w-lg border border-base-300 bg-base-100 shadow-lg">
                <form id="formConversion" class="card-body gap-6">

                    <label class="form-control w-full" for="valor">
                        <div class="label py-1">
                            <span class="label-text font-medium">Número</span>
                        </div>
                        <input
                            type="text"
                            id="valor"
                            name="valor"
                            required
                            placeholder="Ej: 100 (binario) o 4 (decimal)"
                            class="input input-bordered input-primary w-full bg-base-200 text-center text-base font-semibold"
                        />
                    </label>

                    <label class="form-control w-full" for="base">
                        <div class="label py-1">
                            <span class="label-text font-medium">Conversión</span>
                        </div>
                        <select
                            id="base"
                            name="base"
                            required
                            class="select select-bordered select-primary w-full bg-base-200 text-base font-semibold text-center"
                        >
                            <option value="2">Binario → decimal</option>
                            <option value="10">Decimal → binario</option>
                        </select>
                    </label>

                    <button
                        type="submit"
                        class="btn btn-lg border-[#00a000] bg-[#00a000] text-[#0a0a0a] hover:border-[#00b814] hover:bg-[#00b814] hover:text-[#0a0a0a]"
                    >
                        Convertir
                    </button>

                    <div id="resultado" class="flex min-h-[100px] flex-col items-center justify-center gap-2 text-center"></div>

                </form>
            </div>

        </section>

    </main>

    <script src="js/app.js"></script>

</body>
</html>
